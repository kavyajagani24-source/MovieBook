events {
  worker_connections 1024;
}

http {
  # Round-robin across the three application containers.
  # The backup container is used only when all three application containers are unreachable.
  upstream moviebook_app {
    server server1:5000 max_fails=2 fail_timeout=5s;
    server server2:5000 max_fails=2 fail_timeout=5s;
    server server3:5000 max_fails=2 fail_timeout=5s;
    server backup:5000 backup;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://moviebook_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # A simulated-offline container answers 503. Try the next container.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 4;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      add_header X-Load-Balancer nginx always;
    }
  }
}
