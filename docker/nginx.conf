events {
  worker_connections 1024;
}

# This file is only a fallback. The load balancer process uses /tmp/nginx.conf,
# which is rewritten from live container addresses. Hostnames are omitted here
# so a reload still parses when containers 1–3 are stopped.
http {
  server {
    listen 80;
    default_type application/json;
    return 503 '{"error":"Load balancer is reloading","status":"OFFLINE"}';
  }
}
